<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="effect.css">
  <title>自作タイピング(茶道) - 難易度選択</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./image/logo.png">
</head>
<body>
  <h1>茶道タイピング🌿 難易度を選んでください</h1>

  <div id="difficulty-select">
    <button onclick="startGame('easy')">初心者の道</button>
    <button onclick="startGame('normal')">中級者の道</button>
    <button onclick="startGame('hard')">上級者の道</button>
    <button onclick="startGame('lunatic')">いばらの道</button>
    <button onclick="startGame('SuperLunatic')">真・いばらの道</button>
  </div>

  <script>
    function startGame(level) {
      // 難易度情報をURLパラメータとして渡す
      window.location.href = `play.html?difficulty=${level}`;
    }
  </script>
<hr>
<center>
<h3>それぞれの難易度での文字の量(クリアに必要なスコア)</h3>
<p>初心者の道&nbsp<small><font color="green"><u>easy</u><font color="black"></small>:2～3文字(10)</p>
<p>中級者の道&nbsp<small><font color="blue"><u>normal</u><font color="black"></small>:6～9文字(15)</p>
<p>上級者の道&nbsp<small><font color="red"><u>hard</u><font color="black"></small>:7～11文字以上(20)</p>
<p>いばらの道&nbsp<small><font color="purple"><u>lunatic</u><font color="black"></small>:16～36文字以上(23)</p>
<p>真・いばらの道&nbsp<small><font color="white-red"><u>Super</u>&nbsp<font color="purple"><u>Lunatic</u><font color="black"></small>:2～40文字以上(26)</p>
<hr>
<small>
<p>2025&nbsp自作タイピングゲーム(ver1.00_茶道)</p>
</small>
</body>
</html>
