<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自作タイピングゲーム</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./image/logo(sushi).png">
</head>
<body>
  <h1>タイピングゲーム 🍣</h1>

<div id="fatalWarning" style="display:none; background:#200; color:#fff; padding:2em; text-align:center;">
  <p style="font-family:'ＭＳ Ｐゴシック',serif; font-size:14px;">
    タイピングゲームも、時代を越えることはできなかったようです。<br>
    寿司タイピングはここで静かに幕を閉じます。<font color="FF0000">error:ブラウザは対応していません<font color="black">
  </p>
</div>

<script>
    /**
     * @fileoverview ゲームに必要なJavaScript関数の読み込みチェックを行うスクリプト。
     * ページ読み込み完了後、指定された関数がグローバルスコープに存在するか確認し、
     * 存在しない場合はユーザーにエラーメッセージを表示する。
     */

    // 💡チェックしたい関数名を配列で指定してください。
    // typing-game.jsにあるメイン関数名をここに追加してください。
    const functionsToCheck = [
        'startTimer', 
        'startGame', 
        'endGame',
        'detectOS',
        'detectBrowserInfo'  // 例：ゲームの開始、終了、初期化関数
    ]; 

    // ゲームのコンテンツを囲むコンテナのID
    const gameContentId = 'game-container'; 
    // エラーメッセージを表示するコンテナのID
    const errorMessageContainerId = 'envWarning';

    document.addEventListener('DOMContentLoaded', () => {
        const gameContent = document.getElementById(gameContentId);
        const errorMessageContainer = document.getElementById(errorMessageContainerId);

        let hasError = false;
        let errorMessages = '以下の関数が見つかりませんでした:<ul>';

        functionsToCheck.forEach(funcName => {
            // グローバルスコープに関数が存在するかチェック
            if (typeof window[funcName] !== 'function') {
                hasError = true;
                errorMessages += `<li>${funcName}</li>`;
            }
        });
        errorMessages += '</ul><p>ゲームの実行に必要なJavaScriptファイルが正しく読み込まれていない可能性があります。<br>ブラウザのデベロッパーツール（F12キー）で詳細なエラーを確認してください。</p>';

        // 既存のOS・ブラウザチェック関数を呼び出す
        checkFatalBrowser();
        checkUnsupportedOS();

        if (hasError) {
            // JavaScript関数の読み込みエラーがある場合
            if (errorMessageContainer) {
                errorMessageContainer.innerHTML = `
                    <h2>環境エラーが発生しました</h2>
                    ${errorMessages}
                `;
                errorMessageContainer.style.display = 'block';
            }
            // ゲームコンテンツを非表示にする
            if (gameContent) {
                gameContent.style.display = 'none';
            }
        } else {
            // 問題がなければ、ゲームコンテンツを表示し、ゲーム開始
            if (gameContent) {
                gameContent.style.display = 'block';
            }
            if (errorMessageContainer) {
                // 既存のチェックでエラーがない場合、envWarningを非表示に
                errorMessageContainer.style.display = 'none';
            }
            console.log('環境チェック：問題ありません。ゲームを開始します。');
            // ここでゲームの初期化関数を呼び出すのが一般的です
            // 例: initializeGame();
        }
    });

function checkFatalBrowser() {
  var ua = navigator.userAgent.toLowerCase();
  var isIE5OrEarlier = ua.indexOf("msie 5.0") >= 0 || ua.indexOf("msie 4.0") >= 0;
  var isOldChrome = ua.indexOf("chrome/") >= 0 && parseInt(ua.split("chrome/")[1]) < 50;
  var isOldFirefox = ua.indexOf("firefox/") >= 0 && parseInt(ua.split("firefox/")[1]) < 50;

  if (isIE5OrEarlier || isOldChrome || isOldFirefox) {
    var warning = document.getElementById("fatalWarning");
    warning.style.display = "block";

    setTimeout(function() {
      // 強制終了（ウィンドウを閉じる）
      window.open('', '_self');
      window.close();
    }, 2000); // 2秒後に終了
  }
}

checkFatalBrowser();
</script>

<div id="envWarning" style="display:none; background:#111; color:#eee; padding:2em; text-align:center;">
  <p style="font-family:'ＭＳ Ｐゴシック',serif; font-size:14px;">
    この風では、物語はまだ始まりません。<br>
    お使いの環境では、体験は封印されています。
  </p>
  <button onclick="goBackDifficulty()" style="margin-top:1em; padding:0.5em 2em; font-size:14px;">
    難易度選択へ戻る
  </button>
</div>

<script>
function checkUnsupportedOS() {
  var ua = navigator.userAgent.toLowerCase();
  if (
    ua.indexOf("windows nt 5.0") >= 0 || // Windows 2000
    ua.indexOf("windows nt 4.0") >= 0 || //Windows NT4.0
    ua.indexOf("android") >= 0 ||       // Android
    ua.indexOf("iphone") >= 0 ||        // iPhone
    ua.indexOf("ipad") >= 0 ||          // iPad
    ua.indexOf("ipod") >= 0             // iPod
  ) {
    document.getElementById("envWarning").style.display = "block";
  }
}

function goBackDifficulty() {
  location.href = "index.html"; // 遷移先は適宜変更
}

checkUnsupportedOS();
</script>

  <div id="countdown" style="font-size: 2.5em; margin-bottom: 20px;"></div>
  <div id="sushi-static">ここに問題が表示されます</div>
  <div id="result"></div>
  <div id="typed-progress"></div>
  <div id="score">スコア: -</div>
  <div id="timer">残り時間: -</div>
  <div id="score-comment"></div>
  <div id="end-section" style="margin-top: 30px;">
  <button id="retry-button" style="display: none;">もう一度挑戦する 🔁</button>
</div>
<div id="end-section" style="margin-top: 20px;">
  <button id="retry-button" style="display: none;">もう一度挑戦する 🔁</button>
  <button id="back-button" style="display: none;">難易度選択に戻る 🧭</button>
</div>
  <script src="typing-game.js"></script>
<hr>
<script src="OSsupport.js"></script>
<script>
  showDetectedOS(); // 必要なら detectOS() を直接使って分岐してもOK
</script>
    <script src="BrowserDetect.js"></script>
<script>
  showBrowserStatus();
</script>
<hr>
<small>
<p>2025&nbsp自作タイピングゲーム(ver1.06)</p>
</small>
</body>
</html>
