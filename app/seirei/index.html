<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>言葉の神殿へ</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    function resetGameData() {
      const confirmReset = confirm("❓確認：\n初期化を実行してもよろしいでしょうか？");

      if (confirmReset) {
        localStorage.removeItem("easyCleared");
        localStorage.removeItem("normalCleared");
        localStorage.removeItem("hardCleared");
        localStorage.removeItem("lunaticUnlocked");
        localStorage.removeItem("difficulty");

        alert("🌿初期化が完了しました。");
        location.href = "index.html";
      } else {
        alert("🛡️初期化がキャンセルされました。");
      }
    }
  </script>
</head>
<body>
  <div class="centered">
    <h1>精霊の言葉</h1><small>ver1.00</small>
    <p>世界を取り戻すため、言葉を選びましょう</p>
    <button onclick="location.href='difficulty.html'">言葉の柱へ進む</button>
    <br /><br />
    <button onclick="resetGameData()">🧼 記録の浄化(初期化)</button>
  </div>

<br>
<hr>
<p><font color="FF0000">このゲームのサポートは終了しています。新機能(OS判定)の追加はありません。<font color="white"></p>

</body>
</html>
